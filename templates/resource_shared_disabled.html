<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>{{ title or 'Ressource non disponible' }} - Espace Pédagogique</title>

    <!-- Custom fonts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

    <!-- SB Admin 2 / Bootstrap styles -->
    <link href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/css/sb-admin-2.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8fafc;
            color: #1e293b;
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .disabled-card {
            border: 0;
            border-radius: 1.25rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.07);
            max-width: 520px;
            width: 100%;
            overflow: hidden;
            background: #fff;
            text-align: center;
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
    </style>
</head>

<body>

    <div class="container p-3">
        <div class="card disabled-card mx-auto">
            <div class="card-body p-5">
                <div class="icon-circle bg-light border">
                    <i class="fas fa-lock fa-3x text-warning"></i>
                </div>

                <h3 class="font-weight-bold text-gray-900 mb-2">{{ title }}</h3>
                
                <p class="text-muted mb-4 lead" style="font-size: 1.05rem;">
                    {{ reason }}
                </p>

                {% if resource %}
                <div class="bg-light p-3 rounded text-left small text-muted mb-4">
                    <div><strong>Titre :</strong> {{ resource.title }}</div>
                    <div><strong>Module :</strong> {{ resource.module.name }}</div>
                    {% if resource.section %}
                    <div><strong>Chapitre :</strong> {{ resource.section.name }}</div>
                    {% endif %}
                </div>
                {% endif %}

                <p class="small text-muted mb-0">
                    <i class="fas fa-info-circle mr-1"></i> Si vous pensez qu'il s'agit d'une erreur, veuillez contacter votre enseignant.
                </p>
            </div>
        </div>
    </div>

</body>

</html>
