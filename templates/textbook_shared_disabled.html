<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Partage non disponible - Cahier de Texte</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/css/sb-admin-2.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            max-width: 520px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #fee2e2;
            color: #ef4444;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="icon-circle">
            <i class="fas fa-lock"></i>
        </div>
        <h3 class="font-weight-bold text-gray-900 mb-2">Accès Non Autorisé</h3>
        <p class="text-muted mb-4">{{ reason }}</p>
        <div class="p-3 bg-light rounded-lg border text-left small text-muted mb-4">
            <i class="fas fa-info-circle text-primary mr-1"></i>
            Si vous êtes chef d'établissement, inspecteur ou élève, veuillez contacter l'enseignant pour obtenir un lien de partage actif.
        </div>
        <a href="javascript:location.reload()" class="btn btn-primary rounded-pill px-4 font-weight-bold shadow-sm">
            <i class="fas fa-sync-alt mr-1"></i> Réessayer
        </a>
    </div>
</body>
</html>
